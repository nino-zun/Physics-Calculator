<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FC">
<meta name="description" content="高校の物理基礎で使う公式の自動計算アプリ。公式をえらんで数値を入れると、計算の流れを一歩ずつ見せてくれます。">
<title>Physics Calculator - 物理公式計算機</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128207;</text></svg>">
<style>
/* ============================================================
   Physics Calculator — 方眼ノートに赤ペンで採点する、という見立て
   ============================================================ */
:root{
  --paper:#F5F7FC;
  --card:#FFFFFF;
  --grid:#E3E9F6;
  --ink:#141C33;
  --ink2:#5A6788;
  --ink3:#8E99B4;
  --line:#DFE5F2;
  --pen:#E03A3A;          /* 赤ペン：答えと採点だけに使う */
  --pen-bg:#FDEDED;
  --blue:#2B58DE;         /* 青ペン：操作できるもの */
  --blue-bg:#EBF0FF;
  --marker:#FFF2A8;       /* 蛍光ペン：代入した数値 */
  --warn:#9A5B00;
  --warn-bg:#FFF6E5;
  --ok:#0B7A54;
  --r:14px;
  --shadow:0 1px 2px rgba(20,28,51,.06), 0 8px 24px -16px rgba(20,28,51,.35);
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --math:"Latin Modern Math","STIX Two Math","Cambria Math","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  padding-bottom:56px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- ヘッダー ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(245,247,252,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .row{display:flex;align-items:center;gap:10px;min-height:54px}
.topbar .ttl{font-weight:700;font-size:16px;letter-spacing:.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
  width:38px;height:38px;border-radius:11px;font-size:15px;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--blue);color:var(--blue)}
.iconbtn.wide{width:auto;padding:0 12px;gap:6px;font-size:13px;font-weight:600}

/* ---------- ヒーロー ---------- */
.hero{
  margin:18px 0 22px;padding:24px 20px 22px;border-radius:20px;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero h1{
  margin:0;font-size:27px;line-height:1.25;font-weight:800;letter-spacing:-.02em;
  display:inline-block;position:relative;
}
.hero h1 .en{display:block;font-size:12px;font-weight:700;letter-spacing:.22em;
  color:var(--blue);text-transform:uppercase;margin-bottom:6px}
.hero .underline{display:block;height:9px;width:100%;margin-top:-2px;color:var(--pen)}
.hero{display:flex;align-items:flex-end;gap:14px;overflow:hidden}
.hero .hero-txt{flex:1;min-width:0}
.hero p{margin:12px 0 0;color:var(--ink2);font-size:14px;max-width:44ch}
.hero-chara{flex:none;width:clamp(82px,25vw,136px);align-self:flex-end;margin-bottom:-22px;
  filter:drop-shadow(0 8px 18px rgba(20,28,51,.18))}
@media(max-width:360px){.hero-chara{display:none}}

/* ---------- いまのモード表示 ---------- */
.modechip{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:700;
  color:var(--ink2);background:#EDF1FA;border:0;border-radius:11px;padding:9px 13px;cursor:pointer}
.modechip .tiny{font-weight:600;color:var(--ink3)}
.modechip:hover{color:var(--blue)}

/* ---------- 見せかたをえらぶ ---------- */
.modepick{display:grid;gap:10px}
.mp{text-align:left;font:inherit;color:inherit;background:#FBFCFE;border:1.5px solid var(--line);
  border-radius:13px;padding:12px 14px;cursor:pointer}
.mp .t{display:block;font-size:14px;font-weight:700}
.mp .s{display:block;font-size:12px;color:var(--ink3);line-height:1.6;margin-top:2px}
.mp:hover{border-color:var(--blue)}
.mp.on{border-color:var(--pen);background:var(--pen-bg)}
.mp.on .t{color:var(--pen)}

/* ---------- キャラクターをえらぶ ---------- */
.charpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp{font:inherit;color:inherit;background:#FBFCFE;border:1.5px solid var(--line);border-radius:14px;
  padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cp img{width:96px;height:auto;margin-bottom:4px}
.cp .nm{font-size:13.5px;font-weight:700}
.cp .sub{font-size:10.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.cp:hover{border-color:var(--blue)}
.cp.on{border-color:var(--pen);background:var(--pen-bg)}
.cp.on .nm{color:var(--pen)}

/* ---------- キャラクターのふきだし ---------- */
.chat{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.chat .chara{width:82px;flex:none;filter:drop-shadow(0 6px 12px rgba(20,28,51,.14))}
.chat .bubble{position:relative;flex:1;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:var(--ink);box-shadow:var(--shadow)}
.chat .bubble:before{content:'';position:absolute;left:-8px;bottom:16px;width:14px;height:14px;
  background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  transform:rotate(45deg);border-radius:0 0 0 4px}
.chat .bubble.err{border-color:#F3C9C9;background:var(--pen-bg);color:#A81F1F}
.chat .bubble.err:before{background:var(--pen-bg);border-color:#F3C9C9}
.chat.soft .bubble{background:#F8FAFF;color:var(--ink2)}
.chat.soft .bubble:before{background:#F8FAFF}
@media(max-width:400px){.chat .chara{width:64px}}

/* ---------- 1ステップずつ見せる ---------- */
.reveal{margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.rv-head{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:6px}
.rv-head .ttl{font-weight:800;color:var(--ink2);letter-spacing:.04em}
.rv-head .cnt{font-variant-numeric:tabular-nums}
.rv-body .step{padding-left:0;padding-right:0}
.rv-body .step:first-child{border-top:0}
.reveal .chat{margin:6px 0 14px}
.rv-sub{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.answer-wrap{position:relative;margin-top:18px;padding-right:0}
.answer-wrap .answer{margin-top:0;padding-right:96px;text-align:left}
.answer-wrap .answer .dbl{margin-left:0}
.answer-wrap .chara.big{position:absolute;right:2px;bottom:0;width:104px;z-index:1;
  filter:drop-shadow(0 8px 16px rgba(20,28,51,.18));animation:pop .45s cubic-bezier(.2,1.5,.5,1) both}
@media(max-width:420px){.answer-wrap .answer{padding-right:78px}.answer-wrap .chara.big{width:84px}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.answer-wrap .chara.big{animation:none}}
.qchat{text-align:center;margin-top:10px}
.qchat .chara.sm{width:92px;filter:drop-shadow(0 6px 12px rgba(20,28,51,.14));animation:pop .4s ease both}

/* ---------- 汎用 ---------- */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink3);
  margin:26px 0 10px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink3)}

/* カテゴリータイル */
.tile{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);
  transition:transform .12s ease,border-color .12s ease;
}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile .emo{font-size:22px;line-height:1}
.tile>span:not(.emo):not(.go){flex:1;min-width:0}
.tile .t{display:block;font-weight:700;font-size:15px}
.tile .s{display:block;font-size:12px;color:var(--ink3);line-height:1.45}
.tile .go{margin-left:auto;color:var(--ink3);font-size:18px}
.tile[data-cat]{border-left:4px solid var(--c,var(--blue))}

/* 公式リスト行 */
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow)}
.frow:hover{border-color:var(--blue)}
.frow>span:first-child{flex:1;min-width:0}
.frow .nm{display:block;font-size:13px;font-weight:700;color:var(--ink2)}
.frow .math,.item .math{font-size:19px;max-width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.frow .go{margin-left:auto;color:var(--ink3)}

/* ---------- 数式表示 ---------- */
.math{font-family:var(--math);font-size:21px;line-height:1.9;color:var(--ink);
  letter-spacing:.01em;word-break:break-word}
.math.lg{font-size:26px}
.math i{font-style:italic;padding-right:.02em}
.math .gk{font-style:italic}
.math .op{margin:0 .22em}
.math .op-d{font-style:normal}
.math .eq{margin:0 .38em;color:var(--ink2)}
.math .mul{display:inline-block;width:.1em}
.math sup{font-size:.62em;vertical-align:super;line-height:0}
.math sub{font-size:.62em;vertical-align:-.28em;line-height:0;font-style:italic}
.math .pr{font-style:normal}
.math .pn{color:var(--ink2)}
.math .fname{font-style:normal;padding:0 .12em 0 .18em;font-size:.9em}
.math .rad{font-style:normal}
.math .radicand{border-top:1.4px solid currentColor;padding:0 .18em 0 .06em;margin-left:-.04em}
.math .frac{display:inline-flex;flex-direction:column;vertical-align:-.42em;
  text-align:center;margin:0 .16em}
.math .frac>.fn-n{padding:0 .3em;border-bottom:1.4px solid currentColor;line-height:1.25}
.math .frac>.fn-d{padding:0 .3em;line-height:1.25}
.math .hl{background:linear-gradient(transparent 22%,var(--marker) 22%,var(--marker) 88%,transparent 88%);
  padding:0 .06em;border-radius:2px}
.math .unit{font-family:var(--ui);font-size:.62em;color:var(--ink2);font-style:normal}

/* ---------- 計算画面 ---------- */
.fhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}
.fhead .fx{margin-top:10px;text-align:center;padding:6px 0 4px;overflow-x:auto;overflow-y:hidden}
.note{margin-top:10px;font-size:12.5px;color:var(--ink2);background:#F7F9FE;
  border-left:3px solid var(--line);padding:8px 10px;border-radius:0 8px 8px 0}

.pickrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:11px;
  padding:8px 12px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink2);
  display:flex;align-items:baseline;gap:6px}
.pick .math{font-size:17px;line-height:1.2}
.pick:hover{border-color:var(--blue)}
.pick[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-bg);color:var(--pen);font-weight:700}
.pick[aria-pressed="true"] .math{color:var(--pen)}
.pick[disabled]{opacity:.4;cursor:not-allowed}

.field{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field .lab{flex:1;min-width:0}
.field .lab .n{font-size:13px;color:var(--ink2);display:block}
.field .lab .math{font-size:19px;line-height:1.3}
.field input[type=number],.field input[type=text]{
  width:118px;flex:none;font:inherit;font-size:17px;text-align:right;
  padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFF;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--blue);background:#fff}
.field select{font:inherit;font-size:13px;padding:8px 6px;border:1.5px solid var(--line);
  border-radius:10px;background:#FCFDFF;color:var(--ink2);max-width:92px}
.field .u{font-size:13px;color:var(--ink3);width:82px;flex:none}
.field.target{opacity:.55}
.field .findme{font-size:11px;color:var(--pen);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  padding:13px 18px;border-radius:12px;border:1.5px solid transparent;width:100%}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#2148C4}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn.danger{background:var(--card);border-color:#F3C9C9;color:var(--pen)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 答え ---------- */
.answer{
  margin-top:16px;border-radius:18px;padding:20px 18px;text-align:center;
  border:2px solid var(--pen);background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    var(--card);
  position:relative;
}
.answer .cap{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--pen)}
.answer .val{margin-top:6px;color:var(--pen)}
.answer .val .math{font-size:34px;font-weight:600}
.answer .val .math .unit{color:var(--pen);opacity:.85}
.answer .dbl{height:6px;margin:10px auto 0;width:min(220px,70%);
  border-top:2px solid var(--pen);border-bottom:2px solid var(--pen);opacity:.55}

.alert{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:13px;
  background:var(--warn-bg);color:var(--warn);border:1px solid #F2E0BE}
.alert.err{background:var(--pen-bg);color:#A81F1F;border-color:#F3C9C9}
.alert b{font-weight:700}

/* ---------- 途中式（このアプリの主役） ---------- */
.steps{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.steps>.hd{display:flex;align-items:center;gap:8px;padding:13px 15px;cursor:pointer;
  font-weight:700;font-size:14px;background:none;border:0;width:100%;font-family:inherit;color:inherit}
.steps>.hd .go{margin-left:auto;color:var(--ink3);transition:transform .2s}
.steps.open>.hd .go{transform:rotate(90deg)}
.steps .body{border-top:1px solid var(--line);padding:6px 0 10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px 15px 10px 12px;
  position:relative;align-items:baseline}
.step+.step{border-top:1px dashed #EEF1F8}
.step .no{grid-row:span 2;font-size:13px;font-weight:800;color:var(--pen);
  text-align:center;padding-top:2px}
.step .lb{font-size:12px;color:var(--ink3);letter-spacing:.02em}
.step .ex{overflow-x:auto;padding-bottom:2px}
.step.final .ex .math{color:var(--pen);font-weight:600}
.symlist{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
.symlist span{font-size:13px;color:var(--ink2)}
.symlist .math{font-size:17px}
.symlist b{color:var(--pen)}
@media (prefers-reduced-motion:no-preference){
  .steps .body .step, .step.fresh{animation:fadein .32s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
}

/* ---------- 学習モード切替 ---------- */
.modes{display:inline-flex;padding:3px;background:#EDF1FA;border-radius:12px;gap:2px}
.modes button{border:0;background:none;font:inherit;font-size:13px;font-weight:700;
  padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}

/* ---------- 一覧・履歴・管理 ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;box-shadow:var(--shadow)}
.item .hl-row{display:flex;align-items:center;gap:10px}
.item .nm{font-weight:700;font-size:14px;flex:1}
.hist{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.hist .when{font-size:11px;color:var(--ink3)}
.hist .res{font-size:13px;color:var(--ink2);margin-top:2px}
.hidden-f{opacity:.5}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:#EEF1F8;color:var(--ink2)}
.badge.new{background:var(--blue-bg);color:var(--blue)}
.badge.off{background:#F6E7E7;color:var(--pen)}

label.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
input.txt,textarea.txt,select.txt{width:100%;font:inherit;font-size:15px;padding:11px 12px;
  border:1.5px solid var(--line);border-radius:11px;background:#FCFDFF;color:var(--ink)}
textarea.txt{min-height:110px;resize:vertical;line-height:1.7}
input.txt:focus,textarea.txt:focus,select.txt:focus{outline:none;border-color:var(--blue);background:#fff}
.vrow{display:grid;grid-template-columns:1fr 1.4fr .9fr auto;gap:8px;align-items:center;margin-bottom:8px}
.vrow input{font-size:14px;padding:9px 10px}
@media(max-width:520px){.vrow{grid-template-columns:1fr 1fr;}}
.preview{margin-top:10px;padding:12px;border-radius:12px;background:#F7F9FE;text-align:center}
.chkrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink2)}
.chkrow input{width:18px;height:18px;accent-color:var(--blue)}

.tile .syms{font-weight:600;font-size:12.5px;color:var(--ink3);font-family:var(--math);font-style:italic}

/* ---------- 記号の4択テスト ---------- */
.qmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:10px}
.qmeta .qcat{font-weight:700;color:var(--blue);background:var(--blue-bg);padding:3px 9px;border-radius:999px}
.qbar{flex:1;height:5px;border-radius:999px;background:#E6EAF5;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px 16px;text-align:center}
.qask{font-size:13px;color:var(--ink2);font-weight:700}
.qsym{font-size:58px;line-height:1.2;margin:10px 0 18px;color:var(--ink)}
.qname{font-size:23px;font-weight:700;margin:12px 0 18px}
.qchoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.qchoices{grid-template-columns:1fr}}
.qchoice{position:relative;font:inherit;font-size:15px;font-weight:600;color:var(--ink);
  background:#FBFCFE;border:1.5px solid var(--line);border-radius:13px;padding:15px 10px;cursor:pointer;
  min-height:58px;display:flex;align-items:center;justify-content:center}
.qchoice .math{font-size:26px}
.qchoice:hover:not([disabled]){border-color:var(--blue);background:var(--blue-bg)}
.qchoice[disabled]{cursor:default;opacity:.65}
.qchoice.ok{border-color:var(--ok);background:#E8F6F0;color:var(--ok);opacity:1}
.qchoice.ng{border-color:var(--pen);background:var(--pen-bg);color:var(--pen);opacity:1}
.qchoice .mark{position:absolute;top:6px;right:9px;font-size:13px;font-weight:800}
.qfb{margin-top:14px;padding:11px;border-radius:12px;font-size:13.5px;
  background:var(--pen-bg);color:#A81F1F;border:1px solid #F3C9C9}
.qfb.ok{background:#E8F6F0;color:var(--ok);border-color:#BCE3D4}
.qfb .math{font-size:19px}

</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   Physics Calculator - 数式エンジン
   ・上付き( ^ )と下付き( _ )を厳密に区別する
   ・v^2 は「vの2乗」、v_2 は「v2 という別の変数」
   ============================================================ */
var PC = (function () {
  'use strict';

  function PhysError(msg, detail) {
    this.name = 'PhysError';
    this.message = msg;
    this.detail = detail || null;
  }
  PhysError.prototype = Object.create(Error.prototype);

  /* ---------- 1. 正規化 ---------------------------------- */
  var SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  var SUB = '₀₁₂₃₄₅₆₇₈₉';

  function normalize(src) {
    var s = String(src == null ? '' : src);
    s = s.replace(/[\u2212\u2013\u2014\uFF0D]/g, '-')
         .replace(/[×·・∙⋅✕]/g, '*')
         .replace(/[÷]/g, '/')
         .replace(/[（]/g, '(').replace(/[）]/g, ')')
         .replace(/[＝]/g, '=')
         .replace(/[＋]/g, '+').replace(/[＊]/g, '*').replace(/[／]/g, '/')
         .replace(/[\u3000]/g, ' ');
    // W’ / W' → W_prime
    s = s.replace(/([A-Za-z0-9_])['’′]/g, '$1_prime');
    // 上付き数字 → ^n
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, function (m) {
      return '^' + m.replace(/./g, function (c) { return String(SUP.indexOf(c)); });
    });
    // 下付き数字 → _n
    s = s.replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, function (m) {
      return '_' + m.replace(/./g, function (c) { return String(SUB.indexOf(c)); });
    });
    s = s.replace(/½/g, '(1/2)').replace(/⅓/g, '(1/3)').replace(/¼/g, '(1/4)');
    s = s.replace(/[Δ∆]\s*([A-Za-z])/g, 'Delta_$1');
    s = s.replace(/θ/g, 'theta').replace(/π/g, 'pi');
    s = s.replace(/√/g, 'sqrt');
    return s;
  }

  /* ---------- 2. 字句解析 -------------------------------- */
  function tokenize(s, loose) {
    var out = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        var num = parseFloat(s.slice(i, j));
        if (isNaN(num)) throw new PhysError('数値として読めない部分があります：' + s.slice(i, j));
        out.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[A-Za-z]/.test(c)) {
        var k = i;
        while (k < s.length && /[A-Za-z0-9_]/.test(s[k])) k++;
        var raw = s.slice(i, k);
        if (loose) splitIdent(raw).forEach(function (w) { out.push({ t: 'id', v: w }); });
        else out.push({ t: 'id', v: raw });
        i = k; continue;
      }
      if ('+-*/^()='.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new PhysError('式に使えない文字があります：「' + c + '」');
    }
    return out;
  }

  /* mgh → m,g,h のように1文字ずつの掛け算として読む（かんたん入力用） */
  var FUNC_RE = /^(sqrt|asin|acos|atan|sin|cos|tan|abs|exp|ln|log|pi)(?![A-Za-z])/;
  function splitIdent(raw) {
    var out = [], rest = raw, m, guard = 0;
    while (rest.length && guard++ < 60) {
      if ((m = FUNC_RE.exec(rest))) { out.push(m[1]); rest = rest.slice(m[1].length); continue; }
      if ((m = /^Delta_[A-Za-z](?:_[A-Za-z0-9]+)*/.exec(rest))) { out.push(m[0]); rest = rest.slice(m[0].length); continue; }
      if ((m = /^[A-Za-z](?:_[A-Za-z0-9]+)*/.exec(rest))) { out.push(m[0]); rest = rest.slice(m[0].length); continue; }
      rest = rest.slice(1);
    }
    return out;
  }

  var FUNCS = {
    sqrt: function (x) { return Math.sqrt(x); },
    abs: Math.abs,
    sin: function (x) { return Math.sin(x * Math.PI / 180); },
    cos: function (x) { return Math.cos(x * Math.PI / 180); },
    tan: function (x) { return Math.tan(x * Math.PI / 180); },
    asin: function (x) { return Math.asin(x) * 180 / Math.PI; },
    acos: function (x) { return Math.acos(x) * 180 / Math.PI; },
    atan: function (x) { return Math.atan(x) * 180 / Math.PI; },
    ln: Math.log,
    log: function (x) { return Math.log(x) / Math.LN10; },
    exp: Math.exp
  };
  var CONSTS = { pi: Math.PI };   // e は熱効率の変数なので定数にしない

  /* ---------- 3. 構文解析 -------------------------------- */
  function num(v, sub) { return { t: 'num', v: v, sub: !!sub }; }
  function vr(n) { return { t: 'var', name: n }; }
  function bin(op, a, b) { return { t: 'bin', op: op, a: a, b: b }; }

  function Parser(tokens) { this.tk = tokens; this.i = 0; }
  Parser.prototype.peek = function () { return this.tk[this.i]; };
  Parser.prototype.next = function () { return this.tk[this.i++]; };
  Parser.prototype.expect = function (t) {
    var x = this.next();
    if (!x || x.t !== t) throw new PhysError('式の書き方が正しくありません（「' + t + '」が必要です）');
    return x;
  };
  Parser.prototype.parseExpr = function () {
    var n = this.parseTerm();
    while (this.peek() && (this.peek().t === '+' || this.peek().t === '-')) {
      var op = this.next().t;
      n = bin(op, n, this.parseTerm());
    }
    return n;
  };
  Parser.prototype.startsPrimary = function () {
    var p = this.peek();
    return !!p && (p.t === 'num' || p.t === 'id' || p.t === '(');
  };
  Parser.prototype.parseTerm = function () {
    var n = this.parseUnary();
    for (;;) {
      var p = this.peek();
      if (p && (p.t === '*' || p.t === '/')) {
        var op = this.next().t;
        n = bin(op, n, this.parseUnary());
      } else if (this.startsPrimary()) {   // 2x のような省略された掛け算
        n = bin('*', n, this.parseUnary());
      } else break;
    }
    return n;
  };
  Parser.prototype.parseUnary = function () {
    var p = this.peek();
    if (p && p.t === '-') { this.next(); return { t: 'neg', a: this.parseUnary() }; }
    if (p && p.t === '+') { this.next(); return this.parseUnary(); }
    return this.parsePower();
  };
  Parser.prototype.parsePower = function () {
    var base = this.parsePrimary();
    if (this.peek() && this.peek().t === '^') {
      this.next();
      return bin('^', base, this.parseUnary());
    }
    return base;
  };
  Parser.prototype.parsePrimary = function () {
    var p = this.next();
    if (!p) throw new PhysError('式が途中で終わっています');
    if (p.t === 'num') return num(p.v);
    if (p.t === 'id') {
      if (FUNCS[p.v]) {
        var arg;
        if (this.peek() && this.peek().t === '(') { this.next(); arg = this.parseExpr(); this.expect(')'); }
        else arg = this.parsePower();
        return { t: 'fn', name: p.v, a: arg };
      }
      if (CONSTS[p.v] !== undefined) return { t: 'const', name: p.v, v: CONSTS[p.v] };
      return vr(p.v);
    }
    if (p.t === '(') { var e = this.parseExpr(); this.expect(')'); return e; }
    throw new PhysError('式の書き方が正しくありません（「' + (p.v !== undefined ? p.v : p.t) + '」の位置）');
  };

  function parseExpr(src, loose) {
    var p = new Parser(tokenize(normalize(src), loose));
    var n = p.parseExpr();
    if (p.i < p.tk.length) throw new PhysError('式の余分な部分があります');
    return n;
  }
  function parseEquation(src, loose) {
    var s = normalize(src);
    var parts = s.split('=');
    if (parts.length === 1) return { lhs: null, rhs: parseExpr(parts[0], loose) };
    if (parts.length !== 2) throw new PhysError('「=」は1つだけ使えます');
    return { lhs: parseExpr(parts[0], loose), rhs: parseExpr(parts[1], loose) };
  }

  /* ---------- 4. 走査ユーティリティ ---------------------- */
  function walk(n, f) {
    if (!n) return;
    f(n);
    if (n.t === 'bin') { walk(n.a, f); walk(n.b, f); }
    else if (n.t === 'neg' || n.t === 'fn') walk(n.a, f);
  }
  function collectVars(n) {
    var set = [];
    walk(n, function (x) { if (x.t === 'var' && set.indexOf(x.name) < 0) set.push(x.name); });
    return set;
  }
  function equationVars(eq) {
    var a = eq.lhs ? collectVars(eq.lhs) : [];
    var b = collectVars(eq.rhs);
    b.forEach(function (x) { if (a.indexOf(x) < 0) a.push(x); });
    return a;
  }
  function countVar(n, name) {
    var c = 0;
    walk(n, function (x) { if (x.t === 'var' && x.name === name) c++; });
    return c;
  }
  function clone(n) {
    if (!n) return n;
    var o = {};
    for (var k in n) o[k] = n[k];
    if (n.t === 'bin') { o.a = clone(n.a); o.b = clone(n.b); }
    else if (n.t === 'neg' || n.t === 'fn') o.a = clone(n.a);
    return o;
  }

  /* ---------- 5. 評価 ------------------------------------ */
  function evalNode(n, env) {
    switch (n.t) {
      case 'num': return n.v;
      case 'const': return n.v;
      case 'var':
        if (env && env[n.name] !== undefined && env[n.name] !== null && !isNaN(env[n.name])) return env[n.name];
        throw new PhysError('値が入っていない文字があります：' + n.name, { missing: n.name });
      case 'neg': return -evalNode(n.a, env);
      case 'fn': return FUNCS[n.name](evalNode(n.a, env));
      case 'bin': {
        var a = evalNode(n.a, env), b = evalNode(n.b, env);
        switch (n.op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/':
            if (b === 0) throw new PhysError('0で割る計算が発生しました。入力した値を確認してください。');
            return a / b;
          case '^': return Math.pow(a, b);
        }
      }
    }
    throw new PhysError('計算できない式です');
  }

  function substitute(n, env, keep) {
    if (n.t === 'var') {
      if (keep && keep.indexOf(n.name) >= 0) return clone(n);
      if (env[n.name] !== undefined && env[n.name] !== null && !isNaN(env[n.name])) return num(env[n.name], true);
      return clone(n);
    }
    if (n.t === 'bin') return { t: 'bin', op: n.op, a: substitute(n.a, env, keep), b: substitute(n.b, env, keep) };
    if (n.t === 'neg') return { t: 'neg', a: substitute(n.a, env, keep) };
    if (n.t === 'fn') return { t: 'fn', name: n.name, a: substitute(n.a, env, keep) };
    return clone(n);
  }

  /* ---------- 6. 式変形（逆算） --------------------------- */
  function solveSymbolic(eq, target) {
    if (!eq.lhs) return null;
    var cl = countVar(eq.lhs, target), cr = countVar(eq.rhs, target);
    if (cl + cr !== 1) return null;
    var A, B;
    if (cl === 1) { A = clone(eq.lhs); B = clone(eq.rhs); }
    else { A = clone(eq.rhs); B = clone(eq.lhs); }
    var rootTaken = false, guard = 0;
    while (!(A.t === 'var' && A.name === target)) {
      if (guard++ > 60) return null;
      if (A.t === 'neg') { B = { t: 'neg', a: B }; A = A.a; continue; }
      if (A.t === 'fn') {
        var inv = { sin: 'asin', cos: 'acos', tan: 'atan', asin: 'sin', acos: 'cos', atan: 'tan', ln: 'exp', exp: 'ln' };
        if (A.name === 'sqrt') { B = bin('^', B, num(2)); }
        else if (inv[A.name]) { B = { t: 'fn', name: inv[A.name], a: B }; }
        else return null;
        A = A.a; continue;
      }
      if (A.t !== 'bin') return null;
      var inLeft = countVar(A.a, target) === 1;
      var other = inLeft ? A.b : A.a;
      switch (A.op) {
        case '+': B = bin('-', B, other); A = inLeft ? A.a : A.b; break;
        case '-':
          if (inLeft) { B = bin('+', B, A.b); A = A.a; }
          else { B = bin('-', A.a, B); A = A.b; }
          break;
        case '*': B = bin('/', B, other); A = inLeft ? A.a : A.b; break;
        case '/':
          if (inLeft) { B = bin('*', B, A.b); A = A.a; }
          else { B = bin('/', A.a, B); A = A.b; }
          break;
        case '^':
          if (!inLeft) return null;
          if (A.b.t === 'num' && A.b.v === 2) { B = { t: 'fn', name: 'sqrt', a: B }; rootTaken = true; }
          else if (A.b.t === 'num') { B = bin('^', B, bin('/', num(1), num(A.b.v))); if (A.b.v % 2 === 0) rootTaken = true; }
          else return null;
          A = A.a; break;
        default: return null;
      }
    }
    return { expr: simplify(B), rootTaken: rootTaken };
  }

  // 見た目を整えるだけの軽い整理（0の足し引き、1倍、−(−x) など）
  function simplify(n) {
    if (!n || n.t === 'num' || n.t === 'var' || n.t === 'const') return n;
    if (n.t === 'neg') {
      var a = simplify(n.a);
      if (a.t === 'neg') return a.a;
      if (a.t === 'num') return num(-a.v);
      return { t: 'neg', a: a };
    }
    if (n.t === 'fn') return { t: 'fn', name: n.name, a: simplify(n.a) };
    var A = simplify(n.a), B = simplify(n.b);
    if (n.op === '+') {
      if (B.t === 'num' && B.v === 0) return A;
      if (A.t === 'num' && A.v === 0) return B;
      if (B.t === 'neg') return bin('-', A, B.a);
    }
    if (n.op === '-') {
      if (B.t === 'num' && B.v === 0) return A;
      if (B.t === 'neg') return bin('+', A, B.a);
    }
    if (n.op === '*') {
      if (A.t === 'num' && A.v === 1) return B;
      if (B.t === 'num' && B.v === 1) return A;
    }
    if (n.op === '/') {
      if (B.t === 'num' && B.v === 1) return A;
    }
    if (n.op === '^') {
      if (B.t === 'num' && B.v === 1) return A;
    }
    return bin(n.op, A, B);
  }

  /* ---------- 7. 数値解法（同じ文字が2回以上出る式） ------- */
  function solveNumeric(eq, target, env) {
    var f = function (x) {
      var e = Object.create(null);
      for (var k in env) e[k] = env[k];
      e[target] = x;
      return evalNode(eq.lhs, e) - evalNode(eq.rhs, e);
    };
    var s = [f(0), f(1), f(-1), f(2), f(0.5)];
    var scale = 1;
    s.forEach(function (v) { if (isFinite(v)) scale = Math.max(scale, Math.abs(v)); });
    var tol = 1e-9 * scale;
    var p0 = s[0], p1 = (s[1] - s[2]) / 2, p2 = (s[1] + s[2]) / 2 - p0;
    var isPoly = isFinite(p0) && isFinite(p1) && isFinite(p2) &&
      Math.abs(f(2) - (4 * p2 + 2 * p1 + p0)) <= 1e-6 * scale &&
      Math.abs(f(0.5) - (0.25 * p2 + 0.5 * p1 + p0)) <= 1e-6 * scale &&
      Math.abs(f(-3) - (9 * p2 - 3 * p1 + p0)) <= 1e-6 * scale;

    if (isPoly && Math.abs(p2) <= tol) {
      if (Math.abs(p1) <= tol) throw new PhysError('この式からは ' + target + ' を1つに決められません。ほかの値を確認してください。');
      if (Math.abs(p0) <= tol) {
        throw new PhysError('この公式では ' + target + ' が両辺で打ち消し合うため、' + target + ' を求めることはできません。ほかの文字を選んでください。');
      }
      return { root: -p0 / p1, kind: 'linear', A: -p1, B: p0 };
    }
    if (isPoly) {
      var D = p1 * p1 - 4 * p2 * p0;
      if (D < 0) throw new PhysError('実数の答えがありません。入力した値が物理的に成り立つか確認してください。');
      var r1 = (-p1 + Math.sqrt(D)) / (2 * p2), r2 = (-p1 - Math.sqrt(D)) / (2 * p2);
      var roots = [r1, r2].sort(function (a, b) { return a - b; });
      var pos = roots.filter(function (r) { return r > 1e-12; });
      var pick = pos.length ? pos[0] : roots[roots.length - 1];
      return { root: pick, kind: 'quadratic', p2: p2, p1: p1, p0: p0, roots: roots };
    }
    // 一般：符号の変わる区間を探して二分法
    var xs = [], i;
    for (i = -1000; i <= 1000; i++) xs.push(i * 0.5);
    var prevX = null, prevY = null, found = null;
    for (i = 0; i < xs.length; i++) {
      var y;
      try { y = f(xs[i]); } catch (e) { prevX = null; continue; }
      if (!isFinite(y)) { prevX = null; continue; }
      if (Math.abs(y) < 1e-12) { found = [xs[i], xs[i]]; break; }
      if (prevX !== null && prevY * y < 0) { found = [prevX, xs[i]]; break; }
      prevX = xs[i]; prevY = y;
    }
    if (!found) throw new PhysError('この式を ' + target + ' について解けませんでした。値を見直すか、別の文字を求めてください。');
    var lo = found[0], hi = found[1], flo = f(lo);
    for (i = 0; i < 200; i++) {
      var mid = (lo + hi) / 2, fm = f(mid);
      if (flo * fm <= 0) hi = mid; else { lo = mid; flo = fm; }
    }
    return { root: (lo + hi) / 2, kind: 'numeric' };
  }

  /* ---------- 8. 数値の整形 ------------------------------ */
  function roundSig(x, sig) {
    if (!isFinite(x)) return x;
    if (x === 0) return 0;
    if (!(typeof sig === 'number' && sig >= 1 && sig <= 21)) sig = 'auto';
    if (sig === 'auto') return parseFloat(parseFloat(x.toPrecision(12)).toPrecision(6));
    return parseFloat(x.toPrecision(sig));
  }
  function fmt(x, sig) {
    if (x === undefined || x === null || (typeof x === 'number' && !isFinite(x))) return '—';
    var r = roundSig(x, sig === undefined ? 'auto' : sig);
    var a = Math.abs(r);
    if (a !== 0 && (a >= 1e7 || a < 1e-4)) {
      var s = r.toExponential(sig === 'auto' || sig === undefined ? 5 : sig - 1);
      s = s.replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
      return s;
    }
    return String(r);
  }
  function fmtHTML(x, sig) {
    var s = fmt(x, sig);
    var m = /^(-?[\d.]+)e([+-]\d+)$/.exec(s);
    if (m) return m[1] + '×10<sup>' + String(parseInt(m[2], 10)) + '</sup>';
    return s;
  }

  /* ---------- 9. 数式の表示（HTML） ---------------------- */
  var GREEK = { theta: 'θ', pi: 'π', alpha: 'α', beta: 'β', omega: 'ω', rho: 'ρ', mu: 'μ', lambda: 'λ' };

  function renderVarName(name) {
    if (name.indexOf('Delta_') === 0) return '<span class="op-d">Δ</span>' + renderVarName(name.slice(6));
    var parts = name.split('_');
    var base = parts.shift();
    var prime = false;
    if (parts.length && parts[parts.length - 1] === 'prime') { parts.pop(); prime = true; }
    var head = GREEK[base] ? '<span class="gk">' + GREEK[base] + '</span>' : '<i>' + esc(base) + '</i>';
    var sub = parts.length ? '<sub>' + esc(parts.join(',')) + '</sub>' : '';
    return head + (prime ? '<span class="pr">′</span>' : '') + sub;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function prec(n) {
    if (n.t === 'bin') return { '+': 1, '-': 1, '*': 2, '/': 2, '^': 4 }[n.op];
    if (n.t === 'neg') return 1.5;
    return 5;
  }
  function isAtom(n) { return n.t === 'num' || n.t === 'var' || n.t === 'const'; }
  function numericLead(n) {
    if (n.t === 'num' || n.t === 'const') return true;
    if (n.t === 'neg') return numericLead(n.a);
    if (n.t === 'bin') return numericLead(n.a);
    if (n.t === 'fn') return true;
    return false;
  }

  function render(n, sig, parentPrec) {
    var out = renderInner(n, sig);
    if (parentPrec !== undefined && prec(n) < parentPrec && n.t !== 'bin') { /* noop */ }
    return out;
  }
  function wrap(child, minPrec, sig) {

<script>
/* ============================================================
   公式データ ＋ 数式エンジン → 「答え」と「途中式」を作る
   公式ごとの専用コードは書かない。すべてここで汎用処理する。
   ============================================================ */
var SOLVER = (function () {
  'use strict';
  var SUBD = '₀₁₂₃₄₅₆₇₈₉';

  /* 記号を素のテキストにする（エラーメッセージ・履歴用） */
  function plainSym(name) {
    if (name.indexOf('Delta_') === 0) return 'Δ' + plainSym(name.slice(6));
    var parts = name.split('_');
    var base = parts.shift();
    var out = ({ theta: 'θ', pi: 'π' })[base] || base;
    parts.forEach(function (p) {
      if (p === 'prime') { out += '′'; return; }
      out += p.replace(/[0-9]/g, function (d) { return SUBD[+d]; });
    });
    return out;
  }
  function labelOf(f, v) {
    var meta = f.variables[v] || {};
    return (meta.name ? meta.name + ' ' : '') + plainSym(v);
  }
  function unitOf(f, v) { return (f.variables[v] || {}).unit || ''; }

  function getEq(f) { return PC.parseEquation(f.expr, !!f.loose); }
  function varsOf(f) {
    try { return PC.equationVars(getEq(f)); } catch (e) { return []; }
  }
  function solvableVars(f) {
    var no = f.noSolve || [];
    return varsOf(f).filter(function (v) { return no.indexOf(v) < 0; });
  }

  /* ---- 計算本体 ---------------------------------------- */
  function compute(f, target, values, opts) {
    opts = opts || {};
    var sig = opts.sig || 'auto';
    var eq = getEq(f);
    var vars = PC.equationVars(eq);
    if (vars.indexOf(target) < 0) throw new PC.PhysError('この公式に ' + plainSym(target) + ' は出てきません。');
    if ((f.noSolve || []).indexOf(target) >= 0) {
      throw new PC.PhysError('この公式からは ' + plainSym(target) + ' を求められません。' + (f.note || ''));
    }

    var needed = vars.filter(function (v) { return v !== target; });
    var missing = needed.filter(function (v) {
      var x = values[v];
      return x === undefined || x === null || x === '' || isNaN(Number(x));
    });
    if (missing.length) {
      throw new PC.PhysError(
        labelOf(f, target) + ' を求めるには、' +
        missing.map(function (v) { return labelOf(f, v); }).join('・') + ' の値が必要です',
        { missing: missing });
    }

    var env = {};
    needed.forEach(function (v) { env[v] = Number(values[v]); });

    var warnings = [];
    needed.forEach(function (v) {
      if ((f.variables[v] || {}).nonneg && env[v] < 0) {
        warnings.push(labelOf(f, v) + ' に負の値が入っています。物理的に正しいか確認してください。');
      }
    });

    var steps = [];
    steps.push({ key: 'formula', label: '使う公式', html: PC.renderEq(eq, sig) });
    steps.push({
      key: 'symbols', label: '記号の意味',
      symbols: vars.map(function (v) {
        return {
          sym: PC.renderVarName(v), name: (f.variables[v] || {}).name || '',
          unit: unitOf(f, v), target: v === target
        };
      })
    });

    var sol = PC.solveSymbolic(eq, target);
    var value;

    if (sol) {
      /* --- 式変形して代入するパターン --- */
      var isPlain = eq.lhs.t === 'var' && eq.lhs.name === target;
      if (!isPlain) {
        steps.push({
          key: 'transform', label: plainSym(target) + ' について解く',
          html: PC.renderAssign(target, sol.expr, sig)
        });
      }
      var subbed = PC.substitute(sol.expr, env, [target]);
      steps.push({ key: 'substitute', label: '数値を代入する', html: PC.renderAssign(target, subbed, sig) });

      var seq = PC.reduceSteps(subbed, 10);
      seq.forEach(function (s, i) {
        var lab = s.level === 3 ? '2乗・関数を計算する' : s.level === 2 ? 'かけ算・わり算を計算する' : 'たし算・ひき算を計算する';
        if (i === seq.length - 1 && PC.isNumeric(s.node)) lab = '計算する';
        steps.push({ key: 'reduce', label: lab, html: PC.renderAssign(target, s.node, sig) });
      });
      value = PC.evalNode(sol.expr, env);
      if (sol.rootTaken) warnings.push('2乗をふくむ式のため、正の値を答えとしています（向きによっては負の値も答えになります）。');
    } else {
      /* --- 同じ文字が2回以上出るので、式を整理して解くパターン --- */
      var subEq = {
        lhs: PC.substitute(eq.lhs, env, [target]),
        rhs: PC.substitute(eq.rhs, env, [target])
      };
      steps.push({ key: 'substitute', label: '数値を代入する', html: PC.renderEq(subEq, sig) });
      var r = PC.solveNumeric(eq, target, env);
      value = r.root;
      if (r.kind === 'linear') {
        steps.push({
          key: 'reduce', label: plainSym(target) + ' の項をまとめる',
          html: PC.render(PC.bin('*', PC.num(PC.roundSig(r.A, 8)), { t: 'var', name: target }), sig) +
                '<span class="eq">=</span>' + PC.fmtHTML(r.B, sig)
        });
        steps.push({
          key: 'reduce', label: '両辺を ' + PC.fmt(PC.roundSig(r.A, 8), 'auto') + ' でわる',
          html: PC.renderAssign(target, PC.bin('/', PC.num(r.B), PC.num(PC.roundSig(r.A, 8))), sig)
        });
      } else if (r.kind === 'quadratic') {
        steps.push({
          key: 'reduce', label: '2次方程式に整理する',
          html: PC.render(PC.bin('+', PC.bin('*', PC.num(PC.roundSig(r.p2, 6)),
                  PC.bin('^', { t: 'var', name: target }, PC.num(2))),
                  PC.bin('*', PC.num(PC.roundSig(r.p1, 6)), { t: 'var', name: target })), sig) +
                '<span class="op">＋</span>' + PC.fmtHTML(PC.roundSig(r.p0, 6), sig) +
                '<span class="eq">=</span>0'
        });
        steps.push({
          key: 'reduce', label: '解の公式で解く',
          html: PC.renderVarName(target) + '<span class="eq">=</span>' +
                r.roots.map(function (x) { return PC.fmtHTML(x, sig); }).join(' , ')
        });
        if (r.roots.length === 2 && r.roots[0] !== r.roots[1]) {
          warnings.push('答えが2つあります（' + r.roots.map(function (x) { return PC.fmt(x, sig); }).join(' と ') +
            '）。物理的に自然な方を表示しています。問題文に合う方を選んでください。');
        }
      } else {
        steps.push({ key: 'reduce', label: '式を整理して解く', html: PC.renderAssign(target, PC.num(PC.roundSig(value, 8)), sig) });
      }
    }

    if (!isFinite(value)) throw new PC.PhysError('計算結果が求まりませんでした。入力した値（0でわっていないか など）を確認してください。');
    var shown = PC.roundSig(value, sig);
    if ((f.variables[target] || {}).nonneg && shown < 0) {
      warnings.push('答えが負の値になりました。' + labelOf(f, target) + ' は通常は正の値です。入力を確認してください。');
    }
    steps.push({

      terms.forEach(function (p) {
        if (p[0].length > best && before.length >= p[0].length &&
          before.slice(before.length - p[0].length) === p[0]) { kw = p[1]; best = p[0].length; }
      });
      if (!kw) {
        terms.forEach(function (p) {
          if (p[0].length > best && after.indexOf(p[0]) === 0) { kw = p[1]; best = p[0].length; }
        });
      }
      var name = null, useUnit = unit;
      if (kw && unitFits(unit, kw)) name = kw;
      if (!name && unit) {
        var pr = primaryOf(unit);
        if (pr) { name = pr.name; useUnit = pr.factor === 1 ? unit : null; if (pr.factor !== 1) val = val * pr.factor; }
      }
      if (name) add(name, val, useUnit);
    }

    ZERO_HINTS.forEach(function (z) {
      var hit = z.re.exec(t);
      if (hit && !hasName(z.name) && add(z.name, z.value, null)) {
        notes.push('「' + hit[0] + '」なので ' + z.name + ' = ' + z.value + ' としました');
      }
    });

    /* 「ブレーキをかけて止まった」＝ 最後の速度が0、それまでの速さが初速度 */
    if (/止ま(っ|る|り|ら)|停止(し|する)|ブレーキ|減速/.test(t) && !hasName('初速度')) {
      var vi = -1;
      known.forEach(function (k, i) { if (k.name === '速度') vi = i; });
      if (vi >= 0 && /止ま(っ|る|り)|停止(し|する)/.test(t)) {
        known[vi].name = '初速度';
        known.push({ name: '速度', value: 0, unit: null });
        notes.push('「止まった」ので 速度 = 0、それまでの速さを 初速度 としました');
      }
    }

    var target = null, ask = null, mq;
    var qre = /[^。\n]{0,30}(?:求め|もとめ|計算し|答え|こたえ|答を|いくら|どれだけ|示せ|述べ|何[0-9A-Za-z\/²秒度]*|[はをが]\s*[?？])/g;
    while ((mq = qre.exec(t))) ask = mq[0];
    if (ask) {
      var bestEnd = -1, bestLen = 0;
      terms.forEach(function (p) {
        var at = ask.lastIndexOf(p[0]);
        if (at < 0) return;
        var e2 = at + p[0].length;
        if (e2 > bestEnd || (e2 === bestEnd && p[0].length > bestLen)) { target = p[1]; bestEnd = e2; bestLen = p[0].length; }
      });
      if (!target) {
        var mu = /何\s*([A-Za-z\/²]+|秒|度)/.exec(ask);
        if (mu) {
          var pu = primaryOf(normUnit(mu[1] === '秒' ? 's' : mu[1] === '度' ? '℃' : mu[1]));
          if (pu) target = pu.name;
        }
      }
    }
    if (target && nameRemap[target] && validNames.indexOf(nameRemap[target]) >= 0) target = nameRemap[target];
    if (target) known = known.filter(function (k) { return k.name !== target; });

    var cands = candidates(known, target, hintIds);
    return {
      known: known, target: target, notes: notes, hintIds: hintIds,
      graph: GRAPH_RE.test(t),
      noMatch: !!(target && !cands.some(function (c) { return c.pref; })),
      cands: cands
    };
  }

  /* ---------- 写真から文字を読み取る ---------- */
  var TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  function loadTesseract(cb) {
    if (window.Tesseract) return cb(true);
    var done = false, s = document.createElement('script');
    s.src = TESS_URL;
    s.onload = function () { if (!done) { done = true; cb(!!window.Tesseract); } };
    s.onerror = function () { if (!done) { done = true; cb(false); } };
    (document.head || document.body || document.documentElement).appendChild(s);
    setTimeout(function () { if (!done) { done = true; cb(!!window.Tesseract); } }, 20000);
  }
  function ocrSay(msg) {
    if (S.ocr) S.ocr.msg = msg;
    var p = document.getElementById('ocrp');
    if (p) p.textContent = msg; else render();
  }
  function runOCR(file) {
    var url = '';
    try { url = URL.createObjectURL(file); } catch (err) { }
    S.ocr = { img: url, msg: '写真を読み取る準備をしています…', busy: true };
    render();
    loadTesseract(function (ok) {
      if (!ok || !window.Tesseract) {
        S.ocr.busy = false;
        ocrSay('写真の読み取りにはインターネット接続が必要です。つながらないときは、写真を見ながら下の欄に文章を入力してください。');
        return;
      }
      ocrSay('文字を読み取っています…（はじめの1回は少し時間がかかります）');
      window.Tesseract.recognize(file, 'jpn', {
        logger: function (m) {
          if (m.status === 'recognizing text') ocrSay('文字を読み取っています… ' + Math.round((m.progress || 0) * 100) + '%');
          else if (m.status && m.status.indexOf('loading') === 0) ocrSay('読み取り用のデータを準備しています…');
        }
      }).then(function (r) {
        var txt = String((r && r.data && r.data.text) || '')
          .replace(/[\r\n]+/g, ' ').replace(/\s{2,}/g, ' ')
          .replace(/([0-9])\s+([.．])\s*([0-9])/g, '$1.$3').trim();
        S.ocr.busy = false;
        if (!txt) { ocrSay('文字を読み取れませんでした。明るいところで、まっすぐ・大きめに写してみてください。'); return; }
        S.text = txt;
        S.parsed = parseProblem(txt);
        S.ocr.msg = '読み取りました。内容がまちがっていたら、下の文章を直してから「文章を読み取る」をおしてください。';
        render();
      }).catch(function (err) {
        S.ocr.busy = false;
        ocrSay('読み取りに失敗しました（' + String((err && err.message) || err) + '）。文章を入力してください。');
      });
    });
  }

  /* ---------- 記号の4択テスト ----------
     添字のつく vA・v₀ などは出さず、記号そのものだけを出題する */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t2 = a[i]; a[i] = a[j]; a[j] = t2;
    }
    return a;
  }
  var QUIZ_N = 5;
  /* そのジャンルの公式に出てくる記号だけを集める（添字つきは出さない） */
  function quizPool(cat) {
    var used = {};
    visible().forEach(function (f) {
      if (cat && cat !== 'all' && f.category !== cat) return;
      Object.keys(f.variables).forEach(function (v) {
        if (v.indexOf('_') >= 0 || v.indexOf('Delta') === 0) return;
        used[v] = 1;
      });
    });
    return allSymbols().filter(function (s) { return used[s.sym] || (s.custom && (!cat || cat === 'all')); });
  }
  function quizCats() {
    var out = [{ id: 'all', label: 'すべて', icon: '🧠' }];
    allCats().forEach(function (c) { out.push(c); });
    return out.map(function (c) { return { id: c.id, label: c.label, icon: c.icon, n: quizPool(c.id).length }; })
      .filter(function (c) { return c.n > 0; });
  }
  function bestScores() {
    var b = store.get(K.qbest, {});
    if (typeof b === 'number') b = {};          // 以前の記録の形からの移行
    return b || {};
  }
  function makeQuiz(cat) {
    var pool = quizPool(cat);
    if (!pool.length) pool = allSymbols();
    var items = [];
    if (pool.length >= QUIZ_N) {
      shuffle(pool.slice()).slice(0, QUIZ_N).forEach(function (s, i) {
        items.push({ s: s, type: i % 2 === 0 ? 'sym2name' : 'name2sym' });
      });
    } else {
      /* 記号が少ないジャンルでは、同じ記号を「記号→意味」「意味→記号」の両方で出す */
      pool.forEach(function (s) {
        items.push({ s: s, type: 'sym2name' });
        items.push({ s: s, type: 'name2sym' });
      });
      items = shuffle(items).slice(0, QUIZ_N);
    }
    var qs = items.map(function (it) {
      var s = it.s, ban = (s.also || []).concat([s.name]);
      var others = allSymbols().filter(function (o) {
        if (o.sym === s.sym) return false;
        if (ban.indexOf(o.name) >= 0) return false;
        if ((o.also || []).indexOf(s.name) >= 0) return false;
        return true;
      });
      var choices = shuffle(shuffle(others).slice(0, 3).concat([s]));
      return {
        type: it.type, sym: s.sym, name: s.name, unit: s.unit,
        choices: choices.map(function (c) { return { sym: c.sym, name: c.name, ok: c.sym === s.sym }; })
      };
    });
    return { cat: cat, qs: qs, i: 0, picked: null, correct: 0, done: false };
  }
  function quizCatLabel(cat) {
    if (!cat || cat === 'all') return 'すべて';
    var l = cat;
    allCats().forEach(function (c) { if (c.id === cat) l = c.label; });
    return l;
  }
  function viewQuiz() {
    var q = S.quiz;
    if (!q) {
      var best0 = bestScores();
      return '<div class="sp"></div><div class="chat"><img class="chara" src="' + CH().teach + '" alt="">' +
        '<div class="bubble">どのジャンルの記号をためす？ 1回 ' + QUIZ_N + '問だよ。</div></div>' +
        '<h2 class="sec">ジャンルをえらぶ</h2><div class="grid2">' +
        quizCats().map(function (c) {
          var b = best0[c.id];
          return '<button class="tile" data-act="qstart" data-id="' + e(c.id) + '" style="--c:' + (c.id === 'all' ? 'var(--blue)' : catColor(c.id)) + '">' +
            '<span class="emo">' + c.icon + '</span><span><span class="t">' + e(c.label) + '</span>' +
            '<span class="s">記号 ' + c.n + '個' + (b ? '・最高 ' + b + '/' + QUIZ_N : '') + '</span></span>' +
            '<span class="go">›</span></button>';
        }).join('') + '</div>';
    }
    if (q.done) {
      var best = bestScores()[q.cat || 'all'] || 0;
      return '<div class="sp"></div><div class="answer-wrap"><img class="chara big" src="' +
        (q.correct === q.qs.length ? CH().yay : q.correct >= q.qs.length * 0.7 ? CH().correct : CH().teach) + '" alt="">' +
        '<div class="answer"><div class="cap">けっか</div>' +
        '<div class="val"><div class="math">' + q.correct + ' / ' + q.qs.length + '</div></div><div class="dbl"></div></div></div>' +
        '<p class="muted" style="text-align:center;margin-top:12px">' +
        (q.correct === q.qs.length ? '全問正解です。' : q.correct >= q.qs.length * 0.7 ? 'あと少しです。' : 'もう一度ためしてみましょう。') +
        '</p><p class="muted" style="text-align:center">ジャンル：' + e(quizCatLabel(q.cat)) +
        '　最高記録：' + best + ' / ' + q.qs.length + '</p>' +
        '<div class="sp"></div><button class="btn primary" data-act="qagain">もう一度やる</button>' +
        '<div class="sp"></div><button class="btn ghost" data-act="qcats">ジャンルをえらび直す</button>';
    }
    var cur = q.qs[q.i];
    var out = ['<div class="sp"></div><div class="qmeta"><span class="qcat">' + e(quizCatLabel(q.cat)) + '</span>' +
      '<span>' + (q.i + 1) + ' / ' + q.qs.length + '</span>' +
      '<span class="qbar"><i style="width:' + Math.round(q.i / q.qs.length * 100) + '%"></i></span>' +
      '<span>正解 ' + q.correct + '</span></div>'];
    out.push('<div class="qcard">');
    if (cur.type === 'sym2name') {
      out.push('<div class="qask">この記号が表すものは？</div>');
      out.push('<div class="qsym math">' + PC.renderVarName(cur.sym) + '</div>');
    } else {
      out.push('<div class="qask">つぎの量を表す記号は？</div>');
      out.push('<div class="qname">' + e(cur.name) + '<span class="tiny"> ［' + e(cur.unit) + '］</span></div>');
    }
    out.push('<div class="qchoices">');
    cur.choices.forEach(function (c, i) {
      var st = '';
      if (q.picked !== null) st = c.ok ? ' ok' : (q.picked === i ? ' ng' : '');
      out.push('<button class="qchoice' + st + '" data-act="qpick" data-i="' + i + '"' + (q.picked !== null ? ' disabled' : '') + '>' +
        (cur.type === 'sym2name' ? e(c.name) : '<span class="math">' + PC.renderVarName(c.sym) + '</span>') +
        (q.picked !== null && c.ok ? '<span class="mark">✓</span>' : '') +
        (q.picked === i && !c.ok ? '<span class="mark">✕</span>' : '') + '</button>');
    });
    out.push('</div>');
    if (q.picked !== null) {
      var hit = cur.choices[q.picked].ok;
      out.push('<div class="qchat"><img class="chara sm" src="' + (hit ? CH().correct : CH().wrong) + '" alt=""></div>');
      out.push('<div class="qfb' + (hit ? ' ok' : '') + '">' + (hit ? '正解！' : 'ざんねん…') +
        ' <span class="math">' + PC.renderVarName(cur.sym) + '</span> は <b>' + e(cur.name) + '</b>、単位は ' + e(cur.unit) + '</div>');
      out.push('<div class="sp"></div><button class="btn primary" data-act="qnext">' +
        (q.i + 1 < q.qs.length ? 'つぎの問題 ›' : '結果を見る ›') + '</button>');
    }
    out.push('</div>');
    return out.join('');
  }

  /* ---------- 記号の新規登録 ---------- */
  function symDraft() { return S.symDraft || (S.symDraft = { sym: '', name: '', unit: '' }); }
  function saveSymbol() {
    var d = symDraft();
    var sym = PC.normalize((d.sym || '').trim());
    if (!sym) { toast('記号を入れてください'); return; }
    if (sym.indexOf('_') >= 0 || /[0-9]/.test(sym)) {
      toast('4択テストに出せるのは、添字のつかない記号だけです（v₀ や Q₁ は登録できません）'); return;
    }
    if (!/^[A-Za-z]+$/.test(sym)) { toast('記号はアルファベットかギリシャ文字で入れてください'); return; }
    if (!(d.name || '').trim()) { toast('記号の意味を入れてください'); return; }
    if (symbolInfo(sym)) { toast('「' + SOLVER.plainSym(sym) + '」はすでに登録されています'); return; }
    var list = store.get(K.syms, []);
    list.push({ sym: sym, name: d.name.trim(), unit: (d.unit || '').trim() || '（単位なし）', custom: true });
    store.set(K.syms, list);
    S.symDraft = { sym: '', name: '', unit: '' };
    toast('記号を登録しました');
    render();
  }
  function viewSyms() {
    var mine = store.get(K.syms, []);
    var d = symDraft();
    var sym = '';
    try { sym = PC.normalize((d.sym || '').trim()); } catch (err) { sym = ''; }
    var out = ['<div class="sp"></div><div class="chat"><img class="chara" src="' + CH().teach + '" alt="">' +
      '<div class="bubble">新しい記号を登録しておくと、公式を作るときに意味と単位が自動で入って、4択テストにも出せるよ。</div></div>'];
    out.push('<div class="card">');
    out.push('<label class="lbl" for="symid">記号</label>' +
      '<input class="txt" id="symid" value="' + e(d.sym) + '" placeholder="例：p　（θ や pi のようにギリシャ文字も可）" autocomplete="off">');
    out.push('<div class="tiny">添字つき（v₀・Q₁ など）は登録できません。記号そのものだけを登録してください。</div>');
    out.push('<label class="lbl" for="symname">意味</label><input class="txt" id="symname" value="' + e(d.name) + '" placeholder="例：運動量">');
    out.push('<label class="lbl" for="symunit">単位</label><input class="txt" id="symunit" value="' + e(d.unit) + '" placeholder="例：kg・m/s（なければ空のまま）">');
    out.push('<div class="preview">' + (sym && /^[A-Za-z]+$/.test(sym)
      ? '<span class="math lg">' + PC.renderVarName(sym) + '</span>' +
      (d.name ? '<span class="tiny">　' + e(d.name) + (d.unit ? '［' + e(d.unit) + '］' : '') + '</span>' : '')
      : '<span class="tiny">記号を入れると、ここに表示されます</span>') + '</div>');
    out.push('<div class="sp"></div><button class="btn primary" data-act="symsave">この記号を登録する</button></div>');

    out.push('<h2 class="sec">登録した記号</h2>');
    if (!mine.length) out.push('<div class="tiny">まだありません。</div>');
    else out.push('<div class="stack">' + mine.map(function (s) {
      return '<div class="item"><div class="hl-row"><span class="math" style="font-size:22px">' + PC.renderVarName(s.sym) + '</span>' +
        '<span class="nm">' + e(s.name) + '</span><span class="tiny">' + e(s.unit) + '</span>' +
        '<button class="btn danger sm" data-act="symdel" data-id="' + e(s.sym) + '">けす</button></div>' +
        (S.ask === 'sym:' + s.sym ? '<div class="sp"></div>' +
          askBox('「' + SOLVER.plainSym(s.sym) + '：' + s.name + '」の登録をけしますか？', 'dosymdel', 'けす') : '') +
        '</div>';
    }).join('') + '</div>');

    out.push('<h2 class="sec">はじめから入っている記号</h2><div class="card"><div class="symlist">' +
      SYMBOL_QUIZ.map(function (s) {
        return '<span><span class="math">' + PC.renderVarName(s.sym) + '</span>：' + e(s.name) + '</span>';
      }).join('') + '</div></div>');
    return out.join('');
  }

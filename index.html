      '</div>',
      canStore ? '' : '<div class="alert" style="margin-top:16px">このブラウザでは保存領域が使えないため、追加した公式や履歴は<b>ページを閉じるまで</b>の保持になります。ファイルを保存して開くと、そのまま残せます。</div>',
      '<p class="footnote">上付き（v²＝vの2乗）と下付き（v₀＝別の変数）は内部でも区別しています。</p>'
    );
  }

  function viewList() {
    var list = visible().filter(function (f) {
      return S.cat === '__other' ? allCats().every(function (c) { return c.id !== f.category; }) : f.category === S.cat;
    });
    if (!list.length) return '<div class="empty">この分類の公式はまだありません。<br><br><button class="btn ghost sm" data-act="new">＋ 公式を追加</button></div>';
    return '<div class="sp"></div><div class="stack">' + list.map(function (f) {
      return '<button class="frow" data-act="open" data-id="' + e(f.id) + '"><span><span class="nm">' + e(f.name) + '</span>' +
        mathEq(f) + '</span><span class="go">›</span></button>';
    }).join('') + '</div><div class="sp"></div><button class="btn ghost" data-act="new">＋ 公式を追加</button>';
  }

  function viewCalc() {
    var f = getF(S.fid);
    if (!f) return '<div class="empty">公式が見つかりません</div>';
    var vars = SOLVER.varsOf(f), solv = SOLVER.solvableVars(f);
    var out = [];
    out.push('<div class="fhead"><span class="chip" style="background:' + catColor(f.category) + '18;color:' + catColor(f.category) + '">' + e(catLabel(f.category)) + '</span>');
    out.push('<div style="font-weight:700;margin-top:8px">' + e(f.name) + '</div>');
    out.push('<div class="fx">' + mathEq(f, 'lg') + '</div>');
    if (f.note) out.push('<div class="note">' + e(f.note) + '</div>');
    out.push('</div>');

    out.push('<h2 class="sec">求めるもの</h2><div class="pickrow">');
    vars.forEach(function (v) {
      var can = solv.indexOf(v) >= 0;
      out.push('<button class="pick" data-act="target" data-v="' + e(v) + '" aria-pressed="' + (S.target === v) + '"' + (can ? '' : ' disabled title="この公式からは求められません"') + '>' +
        '<span class="math">' + PC.renderVarName(v) + '</span><span>' + e((f.variables[v] || {}).name || '') + '</span></button>');
    });
    out.push('</div>');

    out.push('<h2 class="sec">わかっている値</h2><div class="card">');
    vars.forEach(function (v) {
      var meta = f.variables[v] || {}, isT = v === S.target;
      var conv = unitsFor(f, v);
      out.push('<div class="field' + (isT ? ' target' : '') + '"><span class="lab"><span class="n">' + e(meta.name || '') + (meta.constant ? '（設定でかえられます）' : '') + '</span><span class="math">' + PC.renderVarName(v) + '</span></span>');
      if (isT) {
        out.push('<span class="findme">これを求めます</span>');
      } else {
        out.push('<input type="text" inputmode="decimal" autocomplete="off" data-val="' + e(v) + '" value="' + e(S.vals[v] === undefined ? '' : S.vals[v]) + '" placeholder="—" aria-label="' + e(meta.name || v) + '">');
        if (conv) {
          out.push('<select data-unit="' + e(v) + '">' + Object.keys(conv).map(function (u) {
            return '<option value="' + e(u) + '"' + (S.units[v] === u ? ' selected' : '') + '>' + e(u) + '</option>';
          }).join('') + '</select>');
        } else {
          out.push('<span class="u">' + e(meta.unit || '') + '</span>');
        }
      }
      out.push('</div>');
    });
    out.push('</div><div class="sp"></div>');
    out.push('<button class="btn primary" data-act="calc">計算する</button>');
    out.push('<div class="sp"></div><div class="row-btns" style="justify-content:space-between;align-items:center">');
    out.push('<button class="modechip" data-act="set">' + (settings.learn ? '📖 学習モード' : '⚡ 計算モード') +
      '<span class="tiny">設定でかえる ›</span></button>');
    out.push('<button class="btn ghost sm" data-act="clear">入力をけす</button></div>');
    if (!S.res && !S.err) out.push('<div class="chat soft"><img class="chara" src="' + CH().teach + '" alt="">' +
      '<div class="bubble">' + SAY(settings.learn ? 'hint' : 'hintQuick') + '</div></div>');

    if (S.err) out.push('<div class="chat"><img class="chara" src="' + CH().wrong + '" alt="">' +
      '<div class="bubble err"><b>' + e(SAY('err')) + '</b><br>' + e(S.err) + '</div></div>');

    if (S.res) out.push(settings.learn ? renderReveal(S.res) : renderQuick(S.res));
    return out.join('');
  }

  /* 途中式を1つずつめくって、最後に答えを見せる */
  function stepList(r) {
    var learn = !!settings.learn;
    return r.steps.filter(function (s) { return learn ? true : s.key !== 'symbols'; });
  }
  function saySomething(s) {
    if (s.key === 'formula' || s.key === 'symbols' || s.key === 'transform' ||
      s.key === 'substitute' || s.key === 'answer') return SAY(s.key);
    if (s.label.indexOf('2乗') >= 0) return SAY('sq');
    if (s.label.indexOf('かけ算') >= 0) return SAY('mul');
    if (s.label.indexOf('たし算') >= 0) return SAY('add');
    if (s.label.indexOf('まとめ') >= 0) return SAY('group');
    return SAY('other');
  }
  function stepRow(s, i, isNew) {
    var inner;
    if (s.key === 'symbols') {
      inner = '<div class="symlist">' + s.symbols.map(function (x) {
        return '<span><span class="math">' + x.sym + '</span>：' + (x.target ? '<b>' + e(x.name) + '</b>' : e(x.name)) +
          (x.unit ? '<span class="tiny"> [' + e(x.unit) + ']</span>' : '') + '</span>';
      }).join('') + '</div>';
    } else {
      inner = '<div class="ex"><div class="math">' + s.html + '</div></div>';
    }
    return '<div class="step' + (s.key === 'answer' ? ' final' : '') + (isNew ? ' fresh' : '') + '">' +
      '<span class="no">' + (CIRCLE[i] || (i + 1)) + '</span>' +
      '<span class="lb">' + e(s.label) + '</span>' + inner + '</div>';
  }
  /* 計算モード：答えを先に出し、あとから途中式をひらける */
  function renderQuick(r) {
    var steps = stepList(r);
    var out = ['<div class="answer-wrap"><img class="chara big" src="' + CH().yay + '" alt="">' +
      '<div class="answer"><div class="cap">こたえ</div><div class="val"><div class="math">' +
      PC.renderVarName(r.target) + '<span class="eq">=</span>' + PC.fmtHTML(r.value, settings.sig) +
      (r.unit ? ' <span class="unit">' + e(r.unit) + '</span>' : '') + '</div></div><div class="dbl"></div></div></div>'];
    r.warnings.forEach(function (w) { out.push('<div class="alert">' + e(w) + '</div>'); });
    out.push('<div class="steps' + (S.open ? ' open' : '') + '">' +
      '<button class="hd" data-act="toggle">🔍 計算過程を見る<span class="go">›</span></button>' +
      (S.open ? '<div class="body">' + steps.map(function (s, i) { return stepRow(s, i, false); }).join('') + '</div>' : '') +
      '</div>');
    return out.join('');
  }

  function renderReveal(r) {
    var steps = stepList(r);
    var last = steps.length - 1;
    var at = Math.min(S.step, last);
    var done = at >= last;
    var out = ['<div class="reveal">'];
    out.push('<div class="rv-head"><span class="ttl">計算の流れ</span>' +
      '<span class="qbar"><i style="width:' + Math.round((at + 1) / steps.length * 100) + '%"></i></span>' +
      '<span class="cnt">' + (at + 1) + ' / ' + steps.length + '</span></div>');
    out.push('<div class="rv-body">');
    for (var i = 0; i <= at; i++) {
      if (steps[i].key === 'answer') continue;          // 答えは下の大きなカードで見せる
      out.push(stepRow(steps[i], i, i === at));
    }
    out.push('</div>');

    if (!done) {
      out.push('<div class="chat"><img class="chara" src="' + CH().explain + '" alt="アインシュタイン">' +
        '<div class="bubble">' + e(saySomething(steps[at])) + '</div></div>');
      out.push('<button class="btn primary" data-act="nextstep">' +
        (at + 1 === last ? 'こたえを見る ›' : 'つぎへ ›') + '</button>');
      out.push('<div class="rv-sub">' +
        (at > 0 ? '<button class="btn ghost sm" data-act="prevstep">‹ ひとつ前</button>' : '<span></span>') +
        '<button class="btn ghost sm" data-act="skipsteps">とばして答えを見る</button></div>');
    }
    out.push('</div>');

    if (done) {
      out.push('<div class="answer-wrap"><img class="chara big" src="' + CH().yay + '" alt="">' +
        '<div class="answer"><div class="cap">こたえ</div><div class="val"><div class="math">' +
        PC.renderVarName(r.target) + '<span class="eq">=</span>' + PC.fmtHTML(r.value, settings.sig) +
        (r.unit ? ' <span class="unit">' + e(r.unit) + '</span>' : '') + '</div></div><div class="dbl"></div></div></div>');
      r.warnings.forEach(function (w) { out.push('<div class="alert">' + e(w) + '</div>'); });
      out.push('<div class="sp"></div><button class="btn ghost" data-act="restartsteps">もう一度、はじめから見る</button>');
    }
    return out.join('');
  }

  function viewByQuantity() {
    var idx = groupIndex();
    if (S.cat && idx[S.cat]) {
      var seen = {};
      return '<div class="sp"></div><h2 class="sec">' + e(S.cat) + '（' + e(groupSymbols(idx[S.cat], 8)) + '） を求められる公式</h2><div class="stack">' +
        idx[S.cat].map(function (x) {
          var f = getF(x.fid);
          var key = x.fid + '|' + x.v; if (seen[key]) return ''; seen[key] = 1;
          var sub = x.name !== S.cat ? '<span class="chip" style="background:var(--pen-bg);color:var(--pen)">' + e(x.name) + ' ' + SOLVER.plainSym(x.v) + '</span>' : '';
          return '<button class="frow" data-act="open" data-id="' + e(f.id) + '" data-target="' + e(x.v) + '">' +
            '<span><span class="nm">' + e(f.name) + ' ' + sub + '</span>' + mathEq(f) + '</span><span class="go">›</span></button>';
        }).join('') + '</div>';
    }
    var names = sortGroups(Object.keys(idx));
    return '<div class="sp"></div><p class="muted">求めたい量をえらぶと、その量を計算できる公式だけが出てきます。</p><div class="grid2">' +
      names.map(function (n) {
        var fs = {}; idx[n].forEach(function (x) { fs[x.fid] = 1; });
        return '<button class="tile" data-act="byq-pick" data-id="' + e(n) + '" style="--c:var(--blue)">' +
          '<span><span class="t">' + e(n) + '<span class="syms">（' + e(groupSymbols(idx[n], 3)) + '）</span></span>' +
          '<span class="s">' + Object.keys(fs).length + 'つの公式</span></span><span class="go">›</span></button>';
      }).join('') + '</div>';
  }

  function viewByValues() {
    var idx = quantityIndex();
    var byg = {};
    Object.keys(idx).forEach(function (n) { var g = quantityGroup(n); (byg[g] = byg[g] || []).push(n); });
    var optgroups = sortGroups(Object.keys(byg)).map(function (g) {
      return '<optgroup label="' + e(g) + '">' + byg[g].sort(function (a, b) { return a.localeCompare(b, 'ja'); })
        .map(function (n) { return '<option value="' + e(n) + '">' + e(n) + '</option>'; }).join('') + '</optgroup>';
    }).join('');
    var cands = candidates(S.known);
    var out = ['<div class="sp"></div><p class="muted">わかっている値を入れていくと、使えそうな公式を提案します。</p>'];
    out.push('<div class="card"><div class="vrow" style="grid-template-columns:1.4fr 1fr auto">' +
      '<select class="txt" id="kq">' + optgroups + '</select>' +
      '<input class="txt" id="kv" type="text" inputmode="decimal" autocomplete="off" placeholder="例：0.5">' +
      '<button class="btn primary sm" data-act="addknown">追加</button></div>');
    if (S.known.length) {
      out.push('<div class="stack" style="margin-top:6px">' + S.known.map(function (k, i) {
        return '<div class="field"><span class="lab"><span class="n">' + e(k.name) + '</span></span><b>' + e(String(k.value)) + '</b>' +
          '<button class="iconbtn" data-act="delknown" data-i="' + i + '" aria-label="けす">✕</button></div>';
      }).join('') + '</div>');
    }
    out.push('</div>');
    if (S.known.length) {
      out.push('<h2 class="sec">この値から使えそうな公式</h2>');
      if (!cands.length) out.push('<div class="empty">まだ足りません。もう1つ値を追加してみてください。</div>');
      out.push('<div class="stack">' + cands.slice(0, 8).map(function (c) {
        var nm = (c.f.variables[c.target] || {}).name || '';
        return '<div class="item"><div class="nm">' + e(c.f.name) + '</div>' + mathEq(c.f) +
          '<div class="sp"></div><button class="btn ghost sm" data-act="open" data-id="' + e(c.f.id) + '" data-target="' + e(c.target) + '" data-prefill="1">' +
          nm + ' ' + SOLVER.plainSym(c.target) + ' を求めますか？ ›</button></div>';
      }).join('') + '</div>');
    }
    return out.join('');
  }

  function viewText() {
    var out = ['<div class="sp"></div><p class="muted">問題の文章をはりつけるか、<b>写真をとって</b>読み取ります。推測した内容を<b>かならず確認してから</b>計算してください。</p>'];
    out.push('<div class="card"><div class="row-btns">' +
      '<label class="btn ghost sm" for="pcam">📷 カメラでとる</label>' +
      '<label class="btn ghost sm" for="pimg">🖼 写真をえらぶ</label>' +
      '<input id="pcam" type="file" accept="image/*" capture="environment" hidden>' +
      '<input id="pimg" type="file" accept="image/*" hidden></div>' +
      '<div class="tiny" style="margin-top:8px">スマートフォンでは「カメラでとる」でその場で撮影できます。写真の読み取りにはインターネット接続が必要です。</div>');
    if (S.ocr) {
      out.push('<div class="ocr">' + (S.ocr.img ? '<img src="' + e(S.ocr.img) + '" alt="読み取る写真">' : '') +
        '<div id="ocrp" class="tiny' + (S.ocr.busy ? ' busy' : '') + '">' + e(S.ocr.msg || '') + '</div></div>');
    }
    out.push('</div><div class="sp"></div>');
    out.push('<textarea class="txt" id="ptext" placeholder="例：質量2 kgの物体が5 m/sで運動している。この物体の運動エネルギーを求めよ。">' + e(S.text) + '</textarea>');
    out.push('<div class="sp"></div><button class="btn primary" data-act="parse">文章を読み取る</button>');
    if (S.parsed) {
      var p = S.parsed;
      out.push('<div class="chat"><img class="chara" src="' + CH().teach + '" alt="">' +
        '<div class="bubble">' + e(SAY('parse')) + '</div></div>');
      out.push('<h2 class="sec">この解釈で計算しますか？</h2><div class="card">');
      if (!p.known.length) out.push('<div class="muted">数値を読み取れませんでした。「質量2 kg」のように、量の名前か単位をつけて書いてみてください。</div>');
      p.known.forEach(function (k) {
        out.push('<div class="field"><span class="lab"><span class="n">' + e(k.name) + '</span></span><b>' + e(String(k.value)) +
          (k.unit ? ' <span class="tiny">' + e(k.unit) + '</span>' : '') + '</b></div>');
      });
      out.push('<div class="field"><span class="lab"><span class="n">求めるもの</span></span><b style="color:var(--pen)">' + e(p.target || '（読み取れませんでした）') + '</b></div>');
      out.push('</div>');
      (p.notes || []).forEach(function (n) { out.push('<div class="alert">' + e(n) + '</div>'); });
      if (p.graph) out.push('<div class="alert">グラフや図が必要な問題のようです。図から読み取った数値を自分で入れて計算してください。</div>');
      if (p.noMatch) {
        out.push('<div class="alert">読み取った値だけでは「' + e(p.target) + '」を求められる公式が見つかりませんでした。足りない値を文章に書き足すか、下の公式から選んでください。</div>');
      }
      if (p.cands.length) {
        out.push('<h2 class="sec">' + (p.noMatch ? '参考：この値で計算できる公式' : '使えそうな公式') + '</h2><div class="stack">' + p.cands.slice(0, 5).map(function (c) {
          var nm = (c.f.variables[c.target] || {}).name || '';
          return '<div class="item"><div class="nm">' + e(c.f.name) + '</div>' + mathEq(c.f) + '<div class="sp"></div>' +
            '<button class="btn ghost sm" data-act="open" data-id="' + e(c.f.id) + '" data-target="' + e(c.target) + '" data-prefill="2">' +
            'この解釈で ' + e(nm) + ' を計算する ›</button></div>';
        }).join('') + '</div>');
      } else if (p.known.length) {
        out.push('<div class="alert">この値の組み合わせに合う公式が見つかりませんでした。値を足すか、公式一覧からえらんでください。</div>');
      }
    }
    return out.join('');
  }

  function viewHistory() {
    var hs = store.get(K.hist, []);
    if (!hs.length) return '<div class="sp"></div><div class="chat"><img class="chara" src="' + CH().teach + '" alt="">' +
      '<div class="bubble">' + e(SAY('emptyHist')) + '</div></div>';
    return '<div class="sp"></div><div class="stack">' + hs.map(function (x, i) {
      var d = new Date(x.ts);
      return '<button class="item hist" data-act="rehist" data-i="' + i + '">' +
        '<div class="hl-row"><span class="nm">' + e(x.name) + '</span><span class="when">' +
        (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + '</span></div>' +
        '<div class="res">' + e(x.inputs.join('　')) + '</div>' +
        '<div class="res" style="color:var(--pen);font-weight:700">→ ' + e(x.out) + '</div></button>';
    }).join('') + '</div><div class="sp"></div>' +
      (S.ask === 'clearhist'
        ? askBox('履歴（' + hs.length + '件）をすべてけしますか？ もとにはもどせません。', 'doclearhist', 'すべてけす')
        : '<button class="btn danger" data-act="clearhist">履歴をすべてけす</button>');
  }

  function viewManage() {
    var list = allFormulas();
    return '<div class="sp"></div><button class="btn primary" data-act="new">＋ 公式を追加</button><div class="sp"></div>' +
      '<div class="stack">' + list.map(function (f) {
        return '<div class="item' + (f.hidden ? ' hidden-f' : '') + '"><div class="hl-row"><span class="nm">' + e(f.name) + '</span>' +
          (f.builtin ? (f.edited ? '<span class="badge">編集ずみ</span>' : '') : '<span class="badge new">追加した公式</span>') +
          (f.hidden ? '<span class="badge off">非表示</span>' : '') + '</div>' +
          mathEq(f) + '<div class="tiny">' + e(catLabel(f.category)) + '</div><div class="sp"></div>' +
          '<div class="row-btns">' +
          '<button class="btn ghost sm" data-act="edit" data-id="' + e(f.id) + '">編集</button>' +
          '<button class="btn ghost sm" data-act="dup" data-id="' + e(f.id) + '">複製</button>' +
          '<button class="btn ghost sm" data-act="hide" data-id="' + e(f.id) + '">' + (f.hidden ? '表示にもどす' : '非表示にする') + '</button>' +
          (f.builtin && f.edited ? '<button class="btn ghost sm" data-act="reset1" data-id="' + e(f.id) + '">初期状態にもどす</button>' : '') +
          '</div></div>';
      }).join('') + '</div>' +
      '<div class="tiny" style="margin-top:14px">いらない公式は「非表示にする」で一覧から消せます。あとから「表示にもどす」でいつでも戻せます。</div>' +
      '<h2 class="sec">まとめて元にもどす</h2>' +
      (S.ask === 'resetall'
        ? askBox('追加・編集した公式をすべてけして、はじめの状態にもどしますか？', 'doresetall', '初期状態にもどす')
        : '<button class="btn danger" data-act="resetall">すべて初期状態にもどす</button>');
  }

  function viewSettings() {
    return '<div class="sp"></div><div class="card">' +
      '<label class="lbl" for="setg">重力加速度 g</label>' +
      '<div class="field" style="border:0;padding:0"><input class="txt" id="setg" type="text" inputmode="decimal" autocomplete="off" value="' + e(String(settings.g)) + '" style="width:140px;flex:none;text-align:right"><span class="u">m/s²</span>' +
      '<button class="btn ghost sm" data-act="g98">9.8</button><button class="btn ghost sm" data-act="g10">10</button></div>' +
      '<div class="tiny">授業で 10 m/s² を使うときは、ここをかえてください。計算画面の g に自動で入ります。</div>' +
      '<label class="lbl">いっしょに勉強するキャラクター</label>' +
      '<div class="charpick">' + CHARACTERS.map(function (c) {
        return '<button class="cp' + (settings.chara === c.id ? ' on' : '') + '" data-act="setchara" data-id="' + c.id + '">' +
          '<img src="' + c.img.stand + '" alt=""><span class="nm">' + e(c.name) + '</span>' +
          '<span class="sub">' + e(c.sub) + '</span></button>';
      }).join('') + '</div>' +
      '<label class="lbl" for="setsig">有効数字</label>' +
      '<select class="txt" id="setsig">' + ['auto', '3', '4', '5'].map(function (v) {
        return '<option value="' + v + '"' + (String(settings.sig) === v ? ' selected' : '') + '>' + (v === 'auto' ? '自動（余計な丸めをしない）' : v + '桁') + '</option>';
      }).join('') + '</select>' +
      '<label class="lbl">計算の見せかた</label>' +
      '<div class="modepick">' +
      '<button class="mp' + (settings.learn ? ' on' : '') + '" data-act="setmode" data-m="learn">' +
      '<span class="t">📖 学習モード</span><span class="s">答えを出す前に、途中の式を1つずつ確認します（おすすめ）</span></button>' +
      '<button class="mp' + (settings.learn ? '' : ' on') + '" data-act="setmode" data-m="calc">' +
      '<span class="t">⚡ 計算モード</span><span class="s">先に答えを出し、あとから途中式をひらけます</span></button>' +
      '</div>' +
      '<div class="chkrow"><input type="checkbox" id="setsound"' + (settings.sound ? ' checked' : '') + '><label for="setsound">効果音を鳴らす</label></div>' +
      '<div class="sp"></div><button class="btn primary" data-act="savesettings">設定を保存する</button>' +
      '</div>' +
      '<div class="tiny" style="margin-top:14px">保存先：' + (canStore ? 'このブラウザ（ページを閉じても残ります）' : '一時メモリ（このページを閉じると消えます）') + '</div>';
  }

  /* ---------- 公式エディタ ---------- */
  function blankDraft() {
    return { id: null, name: '', category: 'motion', catName: '', catIcon: '', expr: '', note: '', loose: true, vars: [] };
  }
  function draftFrom(f, asCopy) {
    return {
      id: asCopy ? null : f.id, builtin: !asCopy && f.builtin,
      name: f.name + (asCopy ? ' のコピー' : ''), category: f.category, catName: '', catIcon: '', expr: f.expr,
      note: f.note || '', loose: !!f.loose,
      vars: Object.keys(f.variables).map(function (v) {
        return { sym: v, name: f.variables[v].name || '', unit: f.variables[v].unit || '', nonneg: !!f.variables[v].nonneg, constant: !!f.variables[v].constant };
      })
    };
  }
  function detectVars() {
    var d = S.draft;
    var got = [];
    try { got = PC.equationVars(PC.parseEquation(d.expr, d.loose)); } catch (err) { toast('式を読み取れません：' + err.message); return; }
    var old = {}; d.vars.forEach(function (v) { old[v.sym] = v; });
    d.vars = got.map(function (s) {
      if (old[s]) return old[s];
      var info = symbolInfo(s);
      return {
        sym: s, name: info ? info.name : '', unit: info && info.unit !== '（単位なし）' ? info.unit : '',
        nonneg: false, constant: s === 'g'
      };
    });
    render();
  }
  function viewEditor() {
    var d = S.draft;
    var preview = '';
    try { preview = '<div class="math lg">' + PC.renderEq(PC.parseEquation(d.expr, d.loose), settings.sig) + '</div>'; }
    catch (err) { preview = '<div class="tiny" style="color:var(--pen)">' + e(err.message) + '</div>'; }
    return '<div class="sp"></div><div class="card">' +
      '<label class="lbl" for="ename">公式名</label><input class="txt" id="ename" value="' + e(d.name) + '" placeholder="例：運動量">' +
      '<label class="lbl" for="ecat">カテゴリー</label><select class="txt" id="ecat">' +
      allCats().map(function (c) { return '<option value="' + c.id + '"' + (d.category === c.id ? ' selected' : '') + '>' + c.icon + ' ' + c.label + '</option>'; }).join('') +
      '<option value="__new"' + (d.category === '__new' ? ' selected' : '') + '>＋ 新しいカテゴリーを作る…</option></select>' +
      (d.category === '__new'
        ? '<div class="newcat"><div class="vrow" style="grid-template-columns:72px 1fr">' +
        '<input class="txt" id="ecaticon" value="' + e(d.catIcon || '') + '" placeholder="✨" maxlength="4" aria-label="アイコン">' +
        '<input class="txt" id="ecatname" value="' + e(d.catName || '') + '" placeholder="新しいカテゴリー名（例：運動量）" aria-label="カテゴリー名">' +
        '</div><div class="tiny">アイコンは絵文字を1つ（空ならば ✨ になります）。保存すると、ホームにこのカテゴリーが増えます。</div></div>'
        : '') +
      '<label class="lbl" for="eexpr">公式</label><input class="txt" id="eexpr" value="' + e(d.expr) + '" placeholder="例：p = m*v">' +
      '<div class="tiny">上付きは <b>^</b>（v^2 ＝ vの2乗）、下付きは <b>_</b>（v_0 ＝ v₀）。½ ² ₀ Δ θ √ もそのまま書けます。</div>' +
      '<div class="chkrow"><input type="checkbox" id="eloose"' + (d.loose ? ' checked' : '') + '><label for="eloose">ならんだ文字をかけ算として読む（mv → m×v）</label></div>' +
      '<div class="preview">' + preview + '</div>' +
      '<div class="sp"></div><button class="btn ghost sm" data-act="detect">式から変数を読み取る</button>' +
      '<label class="lbl">変数</label>' +
      (d.vars.length ? '<div class="tiny" style="margin-bottom:6px">記号 ／ 名前 ／ 単位</div>' : '<div class="tiny">「式から変数を読み取る」をおしてください。</div>') +
      d.vars.map(function (v, i) {
        return '<div class="vrow"><input class="txt" data-e="sym" data-i="' + i + '" value="' + e(v.sym) + '" placeholder="p">' +
          '<input class="txt" data-e="name" data-i="' + i + '" value="' + e(v.name) + '" placeholder="運動量">' +
          '<input class="txt" data-e="unit" data-i="' + i + '" value="' + e(v.unit) + '" placeholder="kg・m/s">' +
          '<button class="iconbtn" data-act="delvar" data-i="' + i + '" aria-label="この変数をけす">✕</button></div>';
      }).join('') +
      '<label class="lbl" for="enote">メモ（任意）</label><input class="txt" id="enote" value="' + e(d.note) + '" placeholder="使うときの注意など">' +
      '<div class="sp"></div><button class="btn primary" data-act="savef">この公式を保存する</button>' +
      '</div>';
  }

  function saveFormula() {
    var d = S.draft;
    if (!d.name.trim()) { toast('公式名を入れてください'); return; }
    if (d.category === '__new') {
      var cn = (d.catName || '').trim();
      if (!cn) { toast('新しいカテゴリーの名前を入れてください'); return; }
      var cats = store.get(K.cats, []), exists = null;
      allCats().forEach(function (c) { if (c.label === cn) exists = c; });
      if (exists) { d.category = exists.id; }
      else {
        var cid = 'cat-' + Date.now().toString(36);
        cats.push({ id: cid, label: cn, icon: (d.catIcon || '').trim() || '✨', custom: true });
        store.set(K.cats, cats);
        d.category = cid;
      }
    }
    var eq;
    try { eq = PC.parseEquation(d.expr, d.loose); } catch (err) { toast('式を読み取れません：' + err.message); return; }
    if (!eq.lhs) { toast('「=」を使って、左辺と右辺のある式にしてください（例：p = m*v）'); return; }
    var got = PC.equationVars(eq);
    if (!got.length) { toast('式に変数がありません'); return; }
    var vmap = {};
    d.vars.forEach(function (v) {
      if (got.indexOf(v.sym) < 0) return;
      vmap[v.sym] = { name: v.name || v.sym, unit: v.unit || '' };
      if (v.nonneg) vmap[v.sym].nonneg = true;
      if (v.constant) vmap[v.sym].constant = true;
    });
    got.forEach(function (s) { if (!vmap[s]) vmap[s] = { name: s, unit: '' }; });
    var obj = { name: d.name.trim(), category: d.category, expr: d.expr, note: d.note, loose: d.loose, variables: vmap };

    if (d.id && d.builtin) {
      var ov = store.get(K.ov, {}); ov[d.id] = obj; store.set(K.ov, ov);
    } else if (d.id) {
      var cs = store.get(K.custom, []);
      cs = cs.map(function (f) { return f.id === d.id ? Object.assign({ id: d.id }, obj) : f; });
      store.set(K.custom, cs);
    } else {
      var id = 'user-' + Date.now().toString(36);
      var cs2 = store.get(K.custom, []);
      cs2.push(Object.assign({ id: id }, obj));
      store.set(K.custom, cs2);
      d.id = id;
    }
    toast('公式を保存しました');
    back();
  }

  /* ページによってはブラウザの confirm が出ないので、画面の中で確認する */
  function askBox(msg, actYes, labelYes) {
    return '<div class="askbox"><div class="msg">' + e(msg) + '</div><div class="row-btns">' +
      '<button class="btn danger sm" data-act="' + actYes + '">' + e(labelYes) + '</button>' +
      '<button class="btn ghost sm" data-act="cancelask">やめる</button></div></div>';
  }

  /* ---------- トースト ---------- */
  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#141C33;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = '0'; }, 2200);
  }

  /* ---------- 描画 ---------- */
  var TITLES = {
    home: '', list: '公式をえらぶ', calc: '計算', byq: '求めたいものから探す', byv: '入力した値から探す',
    text: '問題文から計算', quiz: '記号の4択テスト', syms: '記号の新規登録', hist: '計算の履歴', manage: '公式の管理', set: '設定', edit: '公式の編集'
  };
  function render() {
    var app = document.getElementById('app');
    var title = TITLES[S.view] || '';
    if (S.view === 'list') title = catLabel(S.cat === '__other' ? '' : S.cat) || 'その他';
    if (S.view === 'calc') { var f0 = getF(S.fid); title = f0 ? f0.name : '計算'; }
    if (S.view === 'byq' && S.cat) title = S.cat;
    if (S.view === 'edit') title = S.draft && S.draft.id ? '公式の編集' : '公式の追加';

    var head = '<div class="topbar"><div class="wrap"><div class="row">' +
      (S.view === 'home' ? '' : '<button class="iconbtn" data-act="back" aria-label="もどる">‹</button>') +
      '<span class="ttl">' + (S.view === 'home' ? '物理公式計算機' : e(title)) + '</span>' +
      (S.view === 'home' ? '' : '<button class="iconbtn" data-act="home" aria-label="ホーム">⌂</button>') +
      '<button class="iconbtn" data-act="set" aria-label="設定">⚙</button>' +
      '</div></div></div>';

    var body = { home: viewHome, list: viewList, calc: viewCalc, byq: viewByQuantity, byv: viewByValues, text: viewText, hist: viewHistory, manage: viewManage, set: viewSettings, edit: viewEditor, quiz: viewQuiz, syms: viewSyms }[S.view] || viewHome;
    app.innerHTML = head + '<main class="wrap">' + body() + '<div class="sp-lg"></div></main>';
  }

  /* ---------- 操作 ---------- */
  document.addEventListener('click', function (ev) {
    if (!ev.target || !ev.target.closest) return;
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (['calc', 'nextstep', 'skipsteps', 'qpick', 'qnext'].indexOf(a) < 0) beep('tap');
    switch (a) {
      case 'back': back(); break;
      case 'home': stack = []; S.view = 'home'; window.scrollTo(0, 0); render(); break;
      case 'cat': go('list', { cat: id }); break;
      case 'byq': go('byq', { cat: null }); break;
      case 'byq-pick': go('byq', { cat: id }); break;
      case 'byv': go('byv', {}); break;
      case 'bytext': go('text', { ocr: null }); break;
      case 'hist': go('hist', {}); break;
      case 'quiz': go('quiz', { quiz: null }); break;
      case 'syms': go('syms', {}); break;
      case 'symsave': saveSymbol(); break;
      case 'symdel': S.ask = 'sym:' + id; render(); break;
      case 'dosymdel': {
        var target = String(S.ask || '').slice(4);
        store.set(K.syms, store.get(K.syms, []).filter(function (x) { return x.sym !== target; }));
        S.ask = null; toast('けしました'); render(); break;
      }
      case 'qstart': S.quiz = makeQuiz(id); render(); break;
      case 'qcats': S.quiz = null; render(); break;
      case 'qpick': {
        if (S.quiz.picked !== null) break;
        var qi = Number(b.getAttribute('data-i'));
        S.quiz.picked = qi;
        var hit = S.quiz.qs[S.quiz.i].choices[qi].ok;
        if (hit) S.quiz.correct++;
        beep(hit ? 'correct' : 'wrong');
        render(); break;
      }
      case 'qnext': {
        var qz = S.quiz;
        if (qz.i + 1 < qz.qs.length) { qz.i++; qz.picked = null; beep('tap'); }
        else {
          qz.done = true;
          var bs = bestScores(), ck = qz.cat || 'all';
          if (qz.correct > (bs[ck] || 0)) { bs[ck] = qz.correct; store.set(K.qbest, bs); }
          beep(qz.correct >= qz.qs.length * 0.7 ? 'answer' : 'calc');
        }
        render(); break;
      }
      case 'qagain': S.quiz = makeQuiz(S.quiz ? S.quiz.cat : 'all'); render(); break;
      case 'manage': go('manage', {}); break;
      case 'set': go('set', {}); break;
      case 'open': {
        var pf = b.getAttribute('data-prefill');
        var opts = { target: b.getAttribute('data-target') || null };
        if (pf) {
          var list = pf === '2' ? (S.parsed ? S.parsed.cands : []) : candidates(S.known);
          var c = null;
          list.forEach(function (x) { if (x.f.id === id && x.target === opts.target) c = x; });
          if (c) { opts.vals = c.vals; opts.run = true; }
        }
        openFormula(id, opts);
        break;
      }
      case 'target': S.target = b.getAttribute('data-v'); S.res = null; S.err = null; render(); break;
      case 'calc': doCompute(); break;
      case 'toggle': S.open = !S.open; render(); break;
      case 'nextstep': {
        S.step++;
        beep(S.step >= stepList(S.res).length - 1 ? 'answer' : 'step');
        render(); scrollToNew(); break;
      }
      case 'prevstep': S.step = Math.max(0, S.step - 1); render(); break;
      case 'skipsteps': S.step = 99; beep('answer'); render(); scrollToNew(); break;
      case 'restartsteps': S.step = 0; render(); break;
      case 'setmode':
        settings.learn = b.getAttribute('data-m') === 'learn'; saveSettings();
        S.step = 0; S.open = false;
        render(); break;
      case 'clear': {
        var f = getF(S.fid);
        S.vals = {}; S.res = null; S.err = null;
        SOLVER.varsOf(f).forEach(function (v) { if ((f.variables[v] || {}).constant) S.vals[v] = String(settings.g); });
        render(); break;
      }
      case 'addknown': {
        var q = document.getElementById('kq'), v = document.getElementById('kv');
        if (!q || !v || v.value === '') { toast('値を入れてください'); break; }
        var kn = numOf(v.value);
        if (isNaN(kn)) { toast('数字で入れてください（例：0.5）'); break; }
        S.known = S.known.filter(function (x) { return x.name !== q.value; });
        S.known.push({ name: q.value, value: kn });
        v.value = ''; render(); break;
      }
      case 'delknown': S.known.splice(Number(b.getAttribute('data-i')), 1); render(); break;
      case 'parse': {
        var ta = document.getElementById('ptext');
        S.text = ta ? ta.value : '';
        S.parsed = parseProblem(S.text);
        render(); break;
      }
      case 'rehist': {
        var hx = store.get(K.hist, [])[Number(b.getAttribute('data-i'))];
        if (!hx) break;
        if (!getF(hx.fid)) { toast('この公式は今ありません'); break; }
        go('calc', { fid: hx.fid, target: hx.target, vals: Object.assign({}, hx.vals), units: Object.assign({}, hx.units), res: null, err: null });
        doCompute();
        break;
      }
      case 'clearhist': S.ask = 'clearhist'; render(); break;
      case 'doclearhist': store.set(K.hist, []); S.ask = null; toast('履歴をけしました'); render(); break;
      case 'cancelask': S.ask = null; render(); break;
      case 'new': S.draft = blankDraft(); go('edit', {}); break;
      case 'edit': S.draft = draftFrom(getF(id), false); go('edit', {}); break;
      case 'dup': S.draft = draftFrom(getF(id), true); go('edit', {}); break;
      case 'detect': detectVars(); break;
      case 'delvar': S.draft.vars.splice(Number(b.getAttribute('data-i')), 1); render(); break;
      case 'savef': saveFormula(); break;
      case 'hide': {
        var hid = store.get(K.hid, []);
        if (hid.indexOf(id) >= 0) hid = hid.filter(function (x) { return x !== id; }); else hid.push(id);
        store.set(K.hid, hid); render(); break;
      }
      case 'reset1': { var ov = store.get(K.ov, {}); delete ov[id]; store.set(K.ov, ov); toast('初期状態にもどしました'); render(); break; }
      case 'resetall': S.ask = 'resetall'; render(); break;
      case 'doresetall':
        store.set(K.custom, []); store.set(K.ov, {}); store.set(K.hid, []); store.set(K.del, []);
        S.ask = null; toast('初期状態にもどしました'); render(); break;
      case 'setchara': {
        settings.chara = id; saveSettings();
        var gEl = document.getElementById('setg'), sgEl = document.getElementById('setsig');
        if (gEl && numOf(gEl.value) > 0) settings.g = numOf(gEl.value);
        if (sgEl && sgEl.value) settings.sig = sgEl.value === 'auto' ? 'auto' : (Number(sgEl.value) || 'auto');
        saveSettings(); render(); toast(chara().name + 'にかわりました'); break;
      }
      case 'g98': { var g1 = document.getElementById('setg'); if (g1) g1.value = '9.8'; break; }
      case 'g10': { var g2 = document.getElementById('setg'); if (g2) g2.value = '10'; break; }
      case 'savesettings': {
        var gv = numOf(document.getElementById('setg').value);
        if (!isFinite(gv) || gv <= 0) { toast('重力加速度は正の数で入れてください'); break; }
        settings.g = gv;
        var sg = document.getElementById('setsig').value;
        settings.sig = sg === 'auto' ? 'auto' : (Number(sg) || 'auto');
        var snd = document.getElementById('setsound');
        if (snd && typeof snd.checked === 'boolean') settings.sound = !!snd.checked;
        saveSettings(); toast('設定を保存しました'); back(); break;
      }
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-val')) { S.vals[t.getAttribute('data-val')] = t.value; return; }
    if (t.hasAttribute && t.hasAttribute('data-e')) {
      var i = Number(t.getAttribute('data-i'));
      S.draft.vars[i][t.getAttribute('data-e')] = t.value; return;
    }
    if (t.id === 'ename') S.draft.name = t.value;
    if (t.id === 'ecatname') S.draft.catName = t.value;
    if (t.id === 'ecaticon') S.draft.catIcon = t.value;
    if (t.id === 'enote') S.draft.note = t.value;
    if (t.id === 'ptext') S.text = t.value;
    if (t.id === 'symid') {
      symDraft().sym = t.value;
      var pv0 = document.querySelectorAll ? document.querySelectorAll('.preview') : null;
      var pv = pv0 && pv0.length ? pv0[0] : null;
      if (pv) {
        var sv = '';
        try { sv = PC.normalize(String(t.value).trim()); } catch (err2) { sv = ''; }
        pv.innerHTML = sv && /^[A-Za-z]+$/.test(sv)
          ? '<span class="math lg">' + PC.renderVarName(sv) + '</span>'
          : '<span class="tiny">記号を入れると、ここに表示されます</span>';
      }
    }
    if (t.id === 'symname') symDraft().name = t.value;
    if (t.id === 'symunit') symDraft().unit = t.value;
    if (t.id === 'eexpr') {
      S.draft.expr = t.value;
      var pv = document.querySelector('.preview');
      if (pv) {
        try { pv.innerHTML = '<div class="math lg">' + PC.renderEq(PC.parseEquation(S.draft.expr, S.draft.loose), settings.sig) + '</div>'; }
        catch (err) { pv.innerHTML = '<div class="tiny" style="color:var(--pen)">' + e(err.message) + '</div>'; }
      }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-unit')) { S.units[t.getAttribute('data-unit')] = t.value; S.res = null; render(); return; }
    if (t.id === 'setsound') { settings.sound = !!t.checked; saveSettings(); if (settings.sound) beep('correct'); }
    if (t.id === 'ecat') { S.draft.category = t.value; render(); }
    if (t.id === 'eloose') { S.draft.loose = t.checked; render(); }
    if ((t.id === 'pcam' || t.id === 'pimg') && t.files && t.files[0]) { runOCR(t.files[0]); return; }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && S.view === 'calc' && ev.target.hasAttribute && ev.target.hasAttribute('data-val')) {
      ev.preventDefault(); doCompute();
    }
  });

  render();
})();

</script>
</body>
